<div class="card" style="margin-top:14px"><h3>Oxirgi savdolar</h3><div class="tw"><table><tr><th>№</th><th>Filial</th><th>Toʻlov</th><th class="r">Summa</th></tr>${[...a].reverse().slice(0,6).map(s=>`<tr><td>#${s.id}</td><td>${bn(s.b)}</td><td><span class="tag">${PL[s.pay]}</span></td><td class="r">${M(s.t)}</td></tr>`).join('')}</table></div></div>`},

fin(){const a=fs(),x=fx(),by=k=>sum(a.filter(s=>k==='card'?['card','qr','cnum'].includes(s.pay):s.pay===k),s=>s.t),dp=sum(S.dp.filter(p=>S.br==='all'||p.b===S.br),p=>p.a),gp=sum(a,profit),ex=sum(x,e=>e.a),sal=sum(E.filter(e=>S.br==='all'||e.b===S.br),e=>e.s);

function add(id){const p=P.find(x=>x.id==id),c=S.cart.find(i=>i.p==id),b=bid();if((c?c.q:0)>=p.st[b]){toast('Omborda yetarli emas');return}c?c.q++:S.cart.push({p:id,n:p.n,q:1,pr:p.pr,co:p.co});render(1)}

const _vs2=V.set;V.set=function(){return _vs2()+`<div class="card" style="margin-top:14px"><h3>Xavfsizlik — PIN-kod</h3><p style="color:var(--mut);margin-bottom:10px">Ilovaga kirish PIN-kod bilan himoyalangan. 5 daqiqa harakatsizlikdan keyin ilova avtomatik qulflanadi. PIN-kodni admin oʻzgartiradi.</p><div class="row" style="justify-content:flex-start"><button class="btn g" onclick="pinForm()">PIN-kodni oʻzgartirish</button><button class="btn o" onclick="lockApp()">Hozir qulflash</button></div><p style="color:var(--mut);font-size:12px;margin-top:10px">Demo: PIN shu brauzerda saqlanadi. Real tizimda autentifikatsiya serverda boʻladi.</p></div>`};
function pinForm(){form('PIN-kodni oʻzgartirish',[{k:'cur',l:'Joriy PIN-kod',t:'password'},{k:'nw',l:'Yangi PIN-kod (4–8 raqam)',t:'password'},{k:'nw2',l:'Yangi PIN-kodni takrorlang',t:'password'}],o=>{if(o.cur!==PIN){toast('Joriy PIN-kod notoʻgʻri');return}if(!/^\d{4,8}$/.test(o.nw)){toast('PIN 4–8 ta raqamdan iborat boʻlishi kerak');return}if(o.nw!==o.nw2){toast('PIN-kodlar mos kelmadi');return}PIN=o.nw;try{localStorage.setItem('ayub_pin',PIN)}catch(e){}lkDraw();toast('PIN-kod yangilandi')})}
lkDraw();
const CO={n:'AYUB PARFUM',legal:'AYUB PARFUM MChJ',inn:'305 123 456',addr:'Toshkent sh., Chilonzor tumani, Bunyodkor koʻchasi 12',ph:'+998 71 200 00 00',ph2:'+998 90 123 45 67',em:'info@ayubparfum.uz',web:'ayubparfum.uz',tg:'@ayub_parfum',ig:'@ayub.parfum',hrs:'09:00 – 21:00, har kuni'};
[['Toshkent, Chilonzor, Bunyodkor koʻchasi 12','+998 71 200 11 11'],['Toshkent, Yunusobod, Amir Temur shoh koʻchasi 45','+998 71 200 22 22'],['Samarqand, Registon koʻchasi 8','+998 66 200 33 33']].forEach((x,i)=>{B[i].addr=x[0];B[i].ph=x[1]});
try{const s=JSON.parse(localStorage.getItem('ayub_co')||'null');if(s){Object.assign(CO,s.co);B.forEach(b=>Object.assign(b,s.br[b.id]||{}))}}catch(e){}
function applyCO(){const l=$('.logo'),g=$('#lock .lg');if(l&&l.firstChild)l.firstChild.textContent=CO.n.toUpperCase();if(g)g.textContent=CO.n.toUpperCase();document.title=CO.n+' ERP'}
const fld=(id,l,v,w)=>`<div${w?' style="grid-column:1/-1"':''}><label style="font-size:12px;color:var(--mut);display:block;margin-top:8px">${l}</label><input id="${id}" value="${esc(v||'').replace(/"/g,'&quot;')}" style="width:100%"></div>`;
function coCard(){return`<div class="card" style="margin-bottom:14px"><h3>Kompaniya maʼlumotlari</h3><p style="color:var(--mut)">Manzillar va telefon raqamlarini admin oʻzgartiradi. (Namunaviy qiymatlar — oʻzingiznikiga almashtiring.)</p><div class="grid k2" style="gap:0 14px">${fld('co_n','Kompaniya nomi',CO.n)}${fld('co_legal','Yuridik nomi',CO.legal)}${fld('co_inn','STIR (INN)',CO.inn)}${fld('co_hrs','Ish vaqti',CO.hrs)}${fld('co_addr','Bosh ofis manzili',CO.addr,1)}${fld('co_ph','Telefon',CO.ph)}${fld('co_ph2','Qoʻshimcha telefon',CO.ph2)}${fld('co_em','Email',CO.em)}${fld('co_web','Veb-sayt',CO.web)}${fld('co_tg','Telegram',CO.tg)}${fld('co_ig','Instagram',CO.ig)}</div><h3 style="margin-top:18px">Filiallar manzili va telefoni</h3>${B.map(b=>`<div class="grid k2" style="gap:0 14px"><div style="grid-column:1/-1;margin-top:10px"><b>${b.n}</b></div>${fld('ba_'+b.id,'Manzil',b.addr)}${fld('bp_'+b.id,'Telefon',b.ph)}</div>`).join('')}<button class="btn g" style="margin-top:16px" onclick="saveCO()">Saqlash</button></div>`}
function saveCO(){const g=id=>$('#'+id).value.trim(),pr=/^[+\d\s()\-]{7,20}$/,ps=[g('co_ph'),g('co_ph2'),...B.map(b=>g('bp_'+b.id))].filter(Boolean);if(!g('co_n')){toast('Kompaniya nomini kiriting');return}if(ps.some(p=>!pr.test(p))){toast('Telefon raqami notoʻgʻri formatda');return}if(g('co_em')&&!/^\S+@\S+\.\S+$/.test(g('co_em'))){toast('Email notoʻgʻri');return}
Object.assign(CO,{n:g('co_n'),legal:g('co_legal'),inn:g('co_inn'),hrs:g('co_hrs'),addr:g('co_addr'),ph:g('co_ph'),ph2:g('co_ph2'),em:g('co_em'),web:g('co_web'),tg:g('co_tg'),ig:g('co_ig')});B.forEach(b=>{b.addr=g('ba_'+b.id);b.ph=g('bp_'+b.id)});applyCO();try{const br={};B.forEach(b=>br[b.id]={addr:b.addr,ph:b.ph});localStorage.setItem('ayub_co',JSON.stringify({co:CO,br}))}catch(e){}toast('Maʼlumotlar saqlandi');render()}
const _vs3=V.set;V.set=function(){return _vs3().replace('<label>Kompaniya</label><input value="AYUB PARFUM" style="width:100%">','').replace('<div class="grid k2">',()=>coCard()+'<div class="grid k2">')};
const _vb=V.br;V.br=function(){return _vb().replace('<div class="grid k4">',()=>`<div class="card" style="margin-bottom:14px"><div class="row" style="margin:0"><h3 style="margin:0">${esc(CO.n)}</h3><small style="color:var(--mut)">${esc(CO.legal)} · STIR ${esc(CO.inn)}</small></div><p>${esc(CO.addr)}</p><p>${esc(CO.ph)}${CO.ph2?' · '+esc(CO.ph2):''}</p><small style="color:var(--mut)">${esc([CO.em,CO.web,CO.tg,CO.ig,CO.hrs].filter(Boolean).join(' · '))}</small></div><div class="grid k4">`)};
applyCO();
